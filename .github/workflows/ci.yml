name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  compile-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile and unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean install -DskipTests
          # Ledger has no unit tests; gateway runs validator tests only (integration tests run in next job).
          ./mvnw -B test -pl gateway-service -Dtest=PaymentRequestValidatorTest

  integration-test:
    runs-on: ubuntu-latest
    needs: compile-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: docker compose up -d postgres redis kafka

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres -d swiftpay && exit 0
            sleep 2
          done
          exit 1

      - name: Initialize database schema
        run: |
          docker compose exec -T postgres psql -U postgres -d swiftpay -v ON_ERROR_STOP=1 \
            < ledger-service/src/main/resources/schema.sql
          docker compose exec -T postgres psql -U postgres -d swiftpay -v ON_ERROR_STOP=1 \
            < ledger-service/src/main/resources/data.sql

      - name: Wait for Redis
        run: |
          for i in $(seq 1 20); do
            docker compose exec -T redis redis-cli ping | grep -q PONG && exit 0
            sleep 2
          done
          exit 1

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 40); do
            docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 && exit 0
            sleep 3
          done
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean install -DskipTests
          ./mvnw -B test -pl ledger-service,gateway-service -Dtest='*IntegrationTest' -Dspring.profiles.active=integration-test

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    needs: compile-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test stack (gateway + ledger)
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/health && curl -sf http://localhost:8081/health && exit 0
            sleep 5
          done
          docker compose logs gateway ledger
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
