server:
  port: 8080

spring:
  application:
    name: gateway-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftpay}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        acks: all
        retries: 3
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.swiftpay.shared.event
        spring.json.use.type.headers: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    enabled: true
    topics:
      payment-initiated: payment.initiated
      payment-completed: payment.completed
      payment-failed: payment.failed
    consumer:
      retry:
        initial-interval-ms: 1000
        multiplier: 2.0
        max-interval-ms: 30000
        max-attempts: 5
  gateway:
    ledger-balance:
      source: http
    consumer:
      enabled: true
      group-id: transaction-gateway
  redis:
    ttl-hours: 24
  idempotency:
    ttl-hours: 24
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:}
  ledger:
    http:
      base-url: ${APP_LEDGER_HTTP_BASE_URL:http://localhost:8081}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
